[options]
; Odoo 17 Community — DensaMed ERP container configuration (mounted read-only)
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Database isolation: odoo only ever sees its own database.
db_host = db
db_port = 5432
db_user = odoo
db_password = change-me-strong-password
db_name = odoo
dbfilter = ^odoo$
list_db = False

; Production-ish defaults
proxy_mode = True
workers = 2
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; The bridge opens its own psycopg2 connection to `densamed`; keep logging on so
; sync failures surface in `docker compose logs odoo`.
log_level = info
log_handler = :INFO
